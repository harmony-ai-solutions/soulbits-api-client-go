openapi: 3.0.3
# ============================================================================
# Soulbits API — OpenAPI Specification
# ============================================================================
# The single, authoritative machine-readable contract for the entire Soulbits
# Cloud platform REST surface. Covers two hosts:
#   * cloud.soulbits.app   — auth, api keys, account, subscription, platform versions
#   * api.soulbits.app      — inference gateway (OpenAI-compatible + HSE audio)
#
# Version note: this spec targets OpenAPI 3.0.3 (not 3.1) so that both
# first-party client generators consume it natively:
#   * Go:    github.com/oapi-codegen/oapi-codegen/v2 (3.0 today; 3.1 pending #373)
#   * JS/TS: openapi-typescript + openapi-fetch (3.0 + 3.1 both supported)
# 3.1-only constructs (e.g. `type: ["string","null"]` unions) are intentionally
# avoided; nullable fields use the 3.0 `nullable: true` keyword throughout.
# Upgrading to 3.1 later is a mechanical edit if 3.1-only features are needed.
#
# The client libraries are REST-only. Any WebSocket/streaming channel is out of
# scope for this spec — OpenAPI cannot describe WebSocket channels.
#
# Source of truth: this file (pkg/openapi/openapi.yaml). It is embedded into
# the auth-service binary via go:embed and served at GET /v1/openapi.yaml and
# GET /v1/openapi.json with the `servers` array rewritten to the caller's
# access domain (beta.* / soulbits.app / project-harmony.ai legacy / localhost).
#
# The user-facing prose docs (docs/api-usage.md) MUST stay in sync with this
# spec; this spec is the more granular, machine-checked artifact.
# ============================================================================
info:
  title: Soulbits API
  version: 1.0.0
  description: |
    Unified API for the Soulbits Cloud platform — authentication, API keys,
    account, subscription, and multi-modal inference (LLM,
    text embeddings, rerank, TTS, STT, VAD, voice embedding, voice/audio
    conversion).

    The Soulbits API is a meta-API spanning two REST hosts:

      1. **Cloud API** (`cloud.soulbits.app`) — authentication (email/password,
         Google, Apple), API key management, account profile,
         subscription/tier information, and platform versioning.
      2. **Inference API** (`api.soulbits.app`) — OpenAI-compatible chat
         completions and text embeddings, Cohere-compatible rerank, plus the
         Harmony Speech Engine surface (TTS, STT, VAD, speaker embedding,
         audio conversion, voice conversion). Audio payloads are
         base64-encoded inside JSON bodies (NOT multipart). Chat completions
         are non-streaming.

    Two authentication methods are accepted on protected endpoints:
      * **API Key** — `sb_cloud_*` Bearer tokens, best for programmatic use.
      * **PASETO v4.local** — `v4.local.*` Bearer tokens returned by login,
        used by the web portal and mobile clients; refreshable via
        `/v1/auth/refresh`.

    Base URLs (beta shown; production drops the `beta.` prefix):
      * Cloud API:    `https://beta.cloud.soulbits.app`
      * Inference:    `https://beta.api.soulbits.app`

    The served spec rewrites these to match the domain you accessed it from.
  contact:
    name: Soulbits
    url: https://soulbits.app
  license:
    name: Proprietary
    url: https://soulbits.app/terms
  x-generated-from: pkg/openapi/openapi.yaml

# ---------------------------------------------------------------------------
# Servers — canonical defaults. The live endpoint rewrites these per caller.
# Each host is tagged with `description`. Path items override `servers` where
# a path lives on a different host (OpenAPI 3.1 path-level servers).
# ---------------------------------------------------------------------------
servers:
  - url: https://beta.cloud.soulbits.app
    description: Cloud API (auth, account, keys, subscription) — beta
  - url: https://cloud.soulbits.app
    description: Cloud API — production
  - url: https://beta.api.soulbits.app
    description: Inference API — beta
  - url: https://api.soulbits.app
    description: Inference API — production

tags:
  - name: Authentication
    description: Account registration, login, OAuth (Google/Apple), password, email verification, link/unlink.
  - name: API Keys
    description: Create, list, and delete `sb_cloud_*` API keys (PASETO-authenticated only).
  - name: Account
    description: Current user profile + password change.
  - name: Versions
    description: Platform (Harmony Link image) versions.
  - name: Devices
    description: Device registration, authorization, and revocation (D-DEV-04 device authorization gate for cloud sessions).
  - name: Subscription
    description: Subscription tiers and the caller's current subscription.
  - name: Models
    description: Public model catalog.
  - name: Chat
    description: OpenAI-compatible chat completions (LLM). Non-streaming.
  - name: Embeddings
    description: OpenAI-compatible text embeddings.
  - name: Rerank
    description: Cohere-compatible reranking.
  - name: Audio
    description: TTS, STT, VAD, speaker embedding, audio/voice conversion (Harmony Speech Engine). JSON-only, base64 audio.
  - name: Images
    description: Image generation (currently unavailable — no worker deployed).
  - name: OpenAPI
    description: Self-service download of this OpenAPI specification.
  - name: Sync
    description: Data-blind sync relay — pairing tokens, buffer status, and backup blobs (Phase 7-1/7-5). All payloads are opaque and engine-encrypted.

# ---------------------------------------------------------------------------
# Security schemes — both are `http bearer`; the server detects `sb_cloud_`
# prefix vs `v4.local.` prefix. Clients choose which to send.
# ---------------------------------------------------------------------------
security:
  - apiKey: []
  - paseto: []
components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      bearerFormat: sb_cloud_*
      description: |
        API Key (`sb_cloud_*`). Best for long-lived programmatic / server-side
        access. Detected by the `sb_cloud_` prefix. Validated via SHA-256 hash
        + Valkey cache with PostgreSQL fallback; tier resolved at auth time.
    paseto:
      type: http
      scheme: bearer
      bearerFormat: v4.local.*
      description: |
        PASETO v4.local Bearer token (`v4.local.*`) returned by login. Used by
        the web portal and mobile clients. Supports Valkey-backed revocation
        cutoffs. Refresh via `POST /v1/auth/refresh`. API keys CANNOT manage
        other API keys — only PASETO tokens can.

  parameters:
    ApiKeyId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: API key identifier (UUID).
    ModelType:
      name: model_type
      in: query
      required: false
      schema: { type: string }
      description: Exact match on model type (`llm`, `tts`, `stt`, `vad`, `embeddings`, `rerank`, `voice_embed`, `audio_conversion`, `voice_conversion`).
    InputModalities:
      name: input_modalities
      in: query
      required: false
      schema:
        type: array
        items: { type: string }
        uniqueItems: true
      style: form
      explode: true
      description: Superset match — model must accept ALL listed input modalities. Repeat the key for multiple values.
    OutputModalities:
      name: output_modalities
      in: query
      required: false
      schema:
        type: array
        items: { type: string }
        uniqueItems: true
      style: form
      explode: true
      description: Superset match — model must emit ALL listed output modalities. Repeat the key for multiple values.

  responses:
    StandardError:
      description: "Error response. Inference gateway shape: `{\"error\":\"<code>\",\"message\":\"<text>\"}`. Auth-service shape: `{\"error\":\"<message>\"}`."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: 429 Too Many Requests — rate limit exceeded. Includes `Retry-After` header.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema: { type: integer }
        X-RateLimit-Limit: { $ref: "#/components/headers/RateLimitLimit" }
        X-RateLimit-Remaining: { $ref: "#/components/headers/RateLimitRemaining" }
        X-RateLimit-Reset: { $ref: "#/components/headers/RateLimitReset" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: 401 Unauthorized — missing, expired, revoked, or invalid credentials.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: 403 Forbidden — model requires a higher subscription tier.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: 404 Not Found — model not found or resource does not exist.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InternalError:
      description: 500 Internal Server Error — retry with backoff.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  headers:
    RateLimitLimit:
      description: Maximum requests allowed in the current window.
      schema: { type: integer }
    RateLimitRemaining:
      description: Remaining requests in the current window (computed after incrementing the counter).
      schema: { type: integer }
    RateLimitReset:
      description: Unix timestamp (seconds) when the window resets.
      schema: { type: integer, format: int64 }

  schemas:
    # ---- Reusable primitives ----
    RFC3339Timestamp:
      type: string
      format: date-time
      description: RFC 3339 timestamp (e.g. `2026-06-28T19:00:00Z`).
    Base64Audio:
      type: string
      format: byte
      description: Base64-encoded audio bytes (sent inside JSON; NOT multipart).
    Base64Blob:
      type: string
      format: byte
      description: Base64-encoded binary payload (embedding, image, etc.).
    Message:
      type: object
      required: [message]
      properties:
        message: { type: string }

    # ---- Error ----
    Error:
      type: object
      description: |
        Error envelope. The exact field set varies slightly by service:
          * Inference gateway: `{ "error": "<code>", "message": "<text>" }`
          * Auth-service:      `{ "error": "<message>" }` — errors that need
            client branching (e.g. the device-auth flow) instead use the
            gateway shape: `{ "error": "<code>", "message": "<text>" }`
            with a stable code such as `device_not_registered`.
        All variants validate against this schema (extra fields allowed).
      properties:
        error:
          type: string
          description: Error code (inference) OR message (auth-service).
        error_code:
          type: string
          description: Machine-readable error code (where the service emits one).
        message:
          type: string
          description: Human-readable message.
        upgrade_url:
          type: string
          format: uri
          description: Present on 402 quota_exceeded for image generation.
        current_tier:
          type: string
          description: Present on 402 — the user's current tier id.
        required_tier:
          type: string
          description: Present on 402 — the minimum tier required.
        coins_available:
          type: integer
          description: Present on 402 — remaining coins.
        task_id:
          type: string
          description: Present on 504 gateway_timeout — for debugging.
      additionalProperties: true

    # ---- Account: W1 backup-key escrow (phase 2-5) ----
    BackupKeyPutRequest:
      type: object
      required: [wrapped_key]
      description: |
        The client-wrapped backup DEK (2-6's W1 wrap), base64-encoded. The
        backend never sees key material — it escrows the opaque blob under a
        KMS-managed KEK. Scope is deliberately narrow: blob only, ≤1 KiB
        decoded; there is no field for anything else.
      properties:
        wrapped_key:
          type: string
          format: byte
          description: Base64-encoded, client-wrapped backup-key blob (≤1 KiB decoded).

    BackupKeyResponse:
      type: object
      required: [wrapped_key, updated_at]
      properties:
        wrapped_key:
          type: string
          format: byte
          description: The escrowed wrapped-key blob, base64-encoded.
        updated_at: { $ref: "#/components/schemas/RFC3339Timestamp" }

    BackupKeyStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [stored, deleted]
        updated_at: { $ref: "#/components/schemas/RFC3339Timestamp" }

    # ---- Account: sync-group key escrow + rotation flag (phase 7-4) ----
    SyncKeyPutRequest:
      type: object
      required: [wrapped_key]
      description: |
        The client-wrapped sync-group key (7-2), base64-encoded. The backend
        never sees key material — it escrows the opaque blob under a KMS-managed
        KEK. Scope is deliberately narrow: blob only, ≤1 KiB decoded; there is
        no field for anything else.
      properties:
        wrapped_key:
          type: string
          format: byte
          description: Base64-encoded, client-wrapped sync-group-key blob (≤1 KiB decoded).

    SyncKeyResponse:
      type: object
      required: [wrapped_key]
      properties:
        wrapped_key:
          type: string
          format: byte
          description: The escrowed wrapped sync-group-key blob, base64-encoded.

    SyncKeyStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [stored, deleted]
        updated_at: { $ref: "#/components/schemas/RFC3339Timestamp" }

    SyncRotationPutRequest:
      type: object
      required: [required]
      description: |
        Sets the account's sync rotation-required flag. The portal sets
        `required: true` ("Reset sync key"); `required: false` clears it (same as
        DELETE).
      properties:
        required:
          type: boolean

    SyncRotationStatus:
      type: object
      required: [required]
      description: |
        Whether a sync-key rotation is pending for the account. Defaults to
        `false` (no row ⇒ not required).
      properties:
        required:
          type: boolean
          description: True when the portal has flagged a rotation the app must drive.

    # ---- Auth: token response ----
    TokenResponse:
      type: object
      required: [token, refresh_token, expires_at]
      description: Issued on successful login/register-verify/refresh/OAuth. The `expires_at` field lets clients schedule proactive PASETO refresh without decoding the encrypted v4.local payload.
      properties:
        token:
          type: string
          description: PASETO v4.local Bearer token (`v4.local.*`).
        refresh_token:
          type: string
          description: Opaque refresh token. Rotated on each refresh; reuse detection revokes the whole family.
        expires_at: { $ref: "#/components/schemas/RFC3339Timestamp" }

    # ---- Auth: profile ----
    UserProfile:
      type: object
      required: [id, email, display_name, avatar_url, email_verified, created_at, has_password]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        display_name: { type: string }
        avatar_url:
          type: string
          description: User profile picture as a data URL (`data:image/...;base64,...`) or external URL. Empty string when unset.
        email_verified: { type: boolean }
        created_at: { $ref: "#/components/schemas/RFC3339Timestamp" }
        has_password:
          type: boolean
          description: |
            Whether the account has a password set. Accounts created via
            Google/Apple Sign-In have no password; clients use this to render a
            "Set Password" flow instead of "Change Password".

            This is also the gate for the two guarded account operations:
            email change and provider unlink both refuse with
            `403 password_required` while it is false, because a password-less
            account's only credential is the provider link.
        previous_email:
          type: string
          format: email
          nullable: true
          description: The address the account used before its most recent email change. Absent until one has happened.
        email_changed_at:
          allOf:
            - { $ref: "#/components/schemas/RFC3339Timestamp" }
          nullable: true
          description: When the most recent email change was committed.

    EmailChangeStatus:
      type: object
      required: [pending, awaiting_new_confirmation, awaiting_old_confirmation]
      properties:
        pending:
          type: boolean
          description: True while a non-expired change is staged.
        new_email:
          type: string
          format: email
          description: The address being moved to. Omitted when no change is pending.
        awaiting_new_confirmation:
          type: boolean
          description: True between stages 2 and 3 — the new address has not confirmed yet.
        awaiting_old_confirmation:
          type: boolean
          description: True between stages 3 and 5 — the approval email has been sent to the current address.
        expires_at: { $ref: "#/components/schemas/RFC3339Timestamp" }

    LinkedIdentity:
      type: object
      required: [provider, created_at]
      description: One OAuth sign-in method attached to the account.
      properties:
        provider:
          type: string
          enum: [google, apple]
        created_at: { $ref: "#/components/schemas/RFC3339Timestamp" }

    # ---- Auth: active sessions ----
    SessionListItem:
      type: object
      required: [session_id, current, platform, created_at, last_active_at, expires_at]
      description: |
        One signed-in session (one device or browser). A session is created per
        sign-in and survives token rotation, so this list shows every place the
        account is currently signed in.
      properties:
        session_id: { type: string, format: uuid, description: Session identifier (stable across token refreshes). }
        current:
          type: boolean
          description: |
            True for the session that issued the requesting token. The portal
            labels it and does not offer to sign it out (use sign out instead).
        platform:
          type: string
          enum: [android, ios, web, unknown]
          description: Derived from the client User-Agent.
        user_agent:
          type: string
          description: Raw User-Agent recorded for the session. Omitted when unavailable.
        ip_address:
          type: string
          description: Client IP at creation, or the most recent one observed. Omitted when unavailable.
        created_at: { $ref: "#/components/schemas/RFC3339Timestamp" }
        last_active_at:
          allOf:
            - { $ref: "#/components/schemas/RFC3339Timestamp" }
          description: Most recent activity seen for this session (falls back to `created_at`).
        expires_at: { $ref: "#/components/schemas/RFC3339Timestamp" }

    SessionListResponse:
      type: object
      required: [sessions]
      properties:
        sessions:
          type: array
          items: { $ref: "#/components/schemas/SessionListItem" }

    RevokeAllSessionsResponse:
      type: object
      required: [message, sessions_revoked]
      properties:
        message: { type: string }
        sessions_revoked:
          type: integer
          description: Number of sessions signed out.

    # ---- Auth: API keys ----
    APIKeyCreated:
      type: object
      required: [id, name, key, prefix, created_at]
      description: Returned ONLY at creation time. The `key` field is shown once — store it securely.
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        key:
          type: string
          description: Full API key (`sb_cloud_` + base64url). Returned ONLY here; never retrievable later.
          pattern: '^sb_cloud_[A-Za-z0-9_-]+$'
        prefix:
          type: string
          description: First 12 characters of the key, for identification.
        created_at: { $ref: "#/components/schemas/RFC3339Timestamp" }

    APIKeyListItem:
      type: object
      description: Metadata for one API key. Deleted keys are never returned, so there is no revoked/deleted field.
      required: [id, name, prefix, created_at, last_used_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        prefix: { type: string, description: First 12 chars (raw key never returned). }
        created_at: { $ref: "#/components/schemas/RFC3339Timestamp" }
        last_used_at:
          allOf:
            - { $ref: "#/components/schemas/RFC3339Timestamp" }
          nullable: true

    VersionsResponse:
      type: object
      required: [versions, default, default_image]
      properties:
        versions:
          type: array
          items: { type: string }
        default: { type: string }
        default_image: { type: string }

    # ---- Devices ----
    Device:
      type: object
      required: [device_id, user_id, platform, push_token, authorized, created_at, updated_at]
      description: |
        A registered client device. `push_token`, `authorized_at` and
        `last_seen_at` are nullable until observed by the server.
      properties:
        device_id: { type: string, description: Per-install device identity. }
        user_id: { type: string, format: uuid }
        platform:
          type: string
          enum: [android, ios, web]
        push_token:
          type: string
          nullable: true
          description: Push notification token for this install; `null` when push is not registered.
        authorized: { type: boolean }
        authorized_at:
          allOf:
            - { $ref: "#/components/schemas/RFC3339Timestamp" }
          nullable: true
          description: When the device was authorized; `null` until authorized.
        last_seen_at:
          allOf:
            - { $ref: "#/components/schemas/RFC3339Timestamp" }
          nullable: true
        created_at: { $ref: "#/components/schemas/RFC3339Timestamp" }
        updated_at: { $ref: "#/components/schemas/RFC3339Timestamp" }

    DeviceListItem:
      type: object
      required: [device_id, platform, push_token, authorized, created_at, updated_at]
      description: Device list item — same shape as `Device` minus `user_id` (a caller only ever lists their own devices).
      properties:
        device_id: { type: string, description: Per-install device identity. }
        platform:
          type: string
          enum: [android, ios, web]
        push_token:
          type: string
          nullable: true
        authorized: { type: boolean }
        authorized_at:
          allOf:
            - { $ref: "#/components/schemas/RFC3339Timestamp" }
          nullable: true
        last_seen_at:
          allOf:
            - { $ref: "#/components/schemas/RFC3339Timestamp" }
          nullable: true
        created_at: { $ref: "#/components/schemas/RFC3339Timestamp" }
        updated_at: { $ref: "#/components/schemas/RFC3339Timestamp" }

    RegisterDeviceRequest:
      type: object
      required: [device_id, platform]
      description: Register (or refresh) a device install. Omit/`null` `push_token` to clear push registration.
      properties:
        device_id: { type: string, description: Per-install device identity (client-generated UUID). }
        platform:
          type: string
          enum: [android, ios, web]
        push_token:
          type: string
          nullable: true
          description: Push notification token for this install.

    AuthorizeDeviceRequest:
      type: object
      required: [device_id]
      description: |
        Dual-mode request/verify body. Without `code` the server mails the
        6-digit code plus the approval button link (202). With `code` the
        server verifies it and marks the device authorized (200).
      properties:
        device_id: { type: string }
        code:
          type: string
          pattern: '^[0-9]{6}$'
          description: 6-digit email auth code. Omit to request the code + approval link.

    ApproveDeviceRequest:
      type: object
      required: [token]
      description: Redeems the high-entropy approval token from the emailed button URL.
      properties:
        token:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: High-entropy base64url approval token (43 chars) from the email button URL.

    ApproveDeviceResponse:
      type: object
      required: [message, device_id]
      properties:
        message: { type: string }
        device_id: { type: string }

    DeviceAuthorizationStatus:
      type: object
      required: [device_id, authorized, authorization_pending]
      description: Poll state for the device auth flow — the app polls until `authorized` is true.
      properties:
        device_id: { type: string }
        authorized: { type: boolean }
        authorization_pending:
          type: boolean
          description: True while a code/token pair is outstanding for this device.

    # ---- Sync (Phase 7-1) ----
    SyncPairingRequest:
      type: object
      required: [device_id, dataset_id]
      description: Mint a short-lived, single-use pairing token binding (user, device, dataset).
      properties:
        device_id: { type: string }
        dataset_id: { type: string, description: The engine's dataset id (one sync group per dataset). }

    SyncPairingResponse:
      type: object
      required: [token, dataset_id, device_id, expires_at]
      properties:
        token: { type: string, description: Opaque ~128-bit token, shown ONCE. }
        dataset_id: { type: string }
        device_id: { type: string }
        expires_at: { $ref: "#/components/schemas/RFC3339Timestamp" }

    # ---- Device enrollment: delegated enrollment grants (Phase 7-15) ----
    EnrollmentGrantRequest:
      type: object
      required: [device_id]
      description: Mint a short-lived, single-use delegated-enrollment grant from an already-authorized device.
      properties:
        device_id:
          type: string
          description: The MINTING device (the caller's, already authorized) that vouches for the new device.

    EnrollmentGrantResponse:
      type: object
      required: [grant, expires_in]
      description: The opaque grant is shown ONCE; only its SHA-256 is stored.
      properties:
        grant:
          type: string
          description: Opaque ≥128-bit single-use grant.
        expires_in:
          type: integer
          description: Grant lifetime in seconds (300 = 5 min).

    DeviceEnrollRequest:
      type: object
      required: [grant, device_id]
      description: |
        Redeem a delegated-enrollment grant for the enrolled device's OWN
        device-scoped session. NO account auth — the grant IS the credential.
        The device is registered authorized because the minting device vouched
        for it. Enrolled devices are full devices and may themselves mint.
      properties:
        grant: { type: string, description: The single-use grant from the enrollment/QR payload. }
        device_id: { type: string, description: Per-install device identity of the NEW device. }
        device_name: { type: string, description: Display name of the new device (metadata; no server column). }
        platform:
          type: string
          enum: [android, ios, web]
          description: Optional; the enrolling device's platform. Defaults to `android` when omitted.

    # ---- Device connect sessions: portal-mediated engine sign-in (Phase 7-15 C2) ----
    DeviceConnectSessionRequest:
      type: object
      required: [device_id]
      description: >
        The engine announces itself. Public — the engine is not authenticated
        yet; the portal signs the user in and approves.
      properties:
        device_id:
          type: string
          description: Per-install identity of the desktop engine.
        device_name:
          type: string
          description: 'Display name (e.g. "Studio-PC").'
        platform:
          type: string
          enum: [android, ios, web]
          description: Optional; recorded on the approved device row. Defaults to `web`.

    DeviceConnectSessionResponse:
      type: object
      required: [connect_id, session_secret, connect_url, expires_in]
      description: >
        `session_secret` is shown ONCE (only its SHA-256 is stored). `connect_url`
        is the portal URL the engine opens in the system browser.
      properties:
        connect_id:
          type: string
          description: UUID identifying the connect session.
        session_secret:
          type: string
          description: 43-char base64url 256-bit secret; the Bearer credential for the status poll.
        connect_url:
          type: string
          description: 'Absolute portal URL: <PORTAL_BASE_URL>/connect?request=<connect_id>.'
        expires_in:
          type: integer
          description: Lifetime in seconds (600 = 10 min).

    DeviceConnectStatusResponse:
      type: object
      required: [status]
      description: >
        `status` is one of `pending|approved|consumed|expired`. The token fields
        are populated ONLY on the `approved` transition and returned exactly
        once — the row is marked consumed in the same statement.
      properties:
        status: { type: string, enum: [pending, approved, consumed, expired] }
        token: { type: string, description: 'PASETO session token (approved only, once).' }
        refresh_token: { type: string, description: 'Opaque refresh token (approved only, once).' }
        expires_at: { $ref: "#/components/schemas/RFC3339Timestamp" }

    DeviceConnectMetaResponse:
      type: object
      required: [device_name, status]
      description: No-secret metadata read for the portal page (device name + status).
      properties:
        device_name: { type: string }
        status: { type: string, enum: [pending, approved, consumed, expired] }

    DeviceConnectApproveResponse:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok] }

    SyncQuotas:
      type: object
      description: Per-tier sync-relay quotas.
      properties:
        sync_buffer_mb: { type: integer, description: Offline-buffer byte cap (MB). }
        sync_devices: { type: integer, description: Max devices in one sync group. }
        backup_storage_mb: { type: integer, description: Backup blob storage cap (MB). }

    SyncStatus:
      type: object
      properties:
        dataset_id: { type: string }
        device_id: { type: string }
        connected_devices: { type: integer }
        buffered_frames: { type: integer }
        buffered_bytes: { type: integer }
        buffer_cap_bytes: { type: integer }
        last_acked_seq: { type: integer }
        overflow: { type: boolean, description: True when the buffer dropped oldest frames (engine re-baselines). }
        backup_bytes: { type: integer }
        quotas: { $ref: "#/components/schemas/SyncQuotas" }

    BackupPutResponse:
      type: object
      properties:
        sha256: { type: string }
        size: { type: integer }
        device_id: { type: string }

    # ---- Subscription ----
    TierLimits:
      type: object
      description: Per-tier rate/quota limits. `null` means unlimited/not applicable.
      properties:
        chat_requests_per_min: { type: integer, nullable: true }
        chat_requests_per_day: { type: integer, nullable: true }
        voice_minutes_per_day: { type: integer, nullable: true }
        video_gen_per_day: { type: integer, nullable: true }
        video_10s_per_day: { type: integer, nullable: true }
        video_60s_per_day: { type: integer, nullable: true }
        image_gen_per_day: { type: integer, nullable: true }
        message_length_tokens: { type: integer, nullable: true }
        audio_requests_per_min: { type: integer, nullable: true }
        vad_embed_per_min: { type: integer, nullable: true }
      additionalProperties: true

    Tier:
      type: object
      required: [id, display_name, sort_order, limits, features]
      properties:
        id: { type: string, description: "Tier id (`free`, `core`, `infinite`)." }
        display_name: { type: string }
        sort_order: { type: integer }
        limits: { $ref: "#/components/schemas/TierLimits" }
        features:
          type: object
          additionalProperties: true
          description: Arbitrary feature flags.

    SubscriptionMe:
      type: object
      required: [tier_id, display_name, status, expires_at, limits, features]
      properties:
        tier_id: { type: string }
        display_name: { type: string }
        status: { type: string, enum: [active, past_due, canceled, trialing] }
        expires_at:
          allOf:
            - { $ref: "#/components/schemas/RFC3339Timestamp" }
          nullable: true
        limits: { $ref: "#/components/schemas/TierLimits" }
        features:
          type: object
          additionalProperties: true

    # ---- Models catalog ----
    SpeechLanguage:
      type: object
      required: [code, name]
      properties:
        code: { type: string, description: "ISO 639 code (e.g. `EN`, `ZH`, `ES`, `FR`, `JA`)." }
        name: { type: string }
        voices:
          type: array
          items: { type: string }
          description: Valid `voice` values for this language.

    SpeechOptions:
      type: object
      description: Present only on speech models. Field presence maps to a real request parameter the model accepts.
      properties:
        languages:
          type: array
          items: { $ref: "#/components/schemas/SpeechLanguage" }
          description: Present iff the model accepts the `language` request param.
        voices:
          type: array
          items: { type: string }
          description: Present iff the model accepts `voice` WITHOUT a language scope (e.g. KittenTTS).
        supports_single_speaker: { type: boolean, nullable: true }
        supports_voice_cloning: { type: boolean, nullable: true }
        paralinguistic_tags:
          type: array
          items: { type: string }
          description: Effect/emotion tokens embedded directly in the TTS `input` text (e.g. `[whispering]`). No special request field needed.

    ModelEntry:
      type: object
      required: [model_id, display_name, model_type, min_tier, description]
      properties:
        model_id: { type: string }
        display_name: { type: string }
        model_type:
          type: string
          enum: [llm, tts, stt, vad, image, embeddings, rerank, voice_embed, audio_conversion, voice_conversion]
        min_tier: { type: string, enum: [free, core, infinite] }
        description:
          type: string
          description: i18n key (e.g. `models.descriptions.qwen-35-9b`) resolved by the portal; not plaintext.
        input_modalities:
          type: array
          items: { type: string }
          description: e.g. `["text","image","video"]`. Empty array if omitted.
        output_modalities:
          type: array
          items: { type: string }
        context_window:
          type: integer
          nullable: true
          description: Token context window (LLM/embeddings).
        embedding_dimensions:
          type: integer
          nullable: true
          description: Output vector dimensionality (embeddings).
        speech_options: { $ref: "#/components/schemas/SpeechOptions" }

    # ---- Chat ----
    ChatMessage:
      type: object
      required: [role, content]
      properties:
        role: { type: string, enum: [system, user, assistant, tool] }
        content:
          oneOf:
            - type: string
            - type: array
              description: OpenAI multi-modal content parts (text/image_url/etc).
              items:
                type: object
                properties:
                  type: { type: string }
                  text: { type: string }
                  image_url:
                    type: object
                    properties:
                      url: { type: string }
          description: OpenAI-style content; string for text-only, array for multi-modal.

    ChatCompletionRequest:
      type: object
      required: [model, messages]
      properties:
        model:
          type: string
          description: Model ID (e.g. `qwen-35-9b`).
          examples: [qwen-35-9b]
        messages:
          type: array
          items: { $ref: "#/components/schemas/ChatMessage" }
        temperature:
          type: number
          minimum: 0
          maximum: 2
        max_tokens: { type: integer, minimum: 1 }
        top_p: { type: number, minimum: 0, maximum: 1 }
        frequency_penalty: { type: number, minimum: -2, maximum: 2 }
        presence_penalty: { type: number, minimum: -2, maximum: 2 }
        seed: { type: integer, description: Reproducible sampling seed. }
        stop:
          oneOf:
            - { type: string }
            - type: array
              items: { type: string }
          description: Stop sequence(s).
        response_format:
          type: object
          description: "OpenAI response format (`{\"type\":\"text\"}` or `{\"type\":\"json_object\"}`)."
          properties:
            type: { type: string, enum: [text, json_object] }
        logprobs:
          type: boolean
          description: Return log probabilities.
        top_logprobs:
          type: integer
          minimum: 0
          maximum: 20
          description: Number of top logprobs per token (requires `logprobs:true`).
        tools:
          type: array
          description: OpenAI function-calling tool definitions.
          items:
            type: object
        tool_choice:
          oneOf:
            - { type: string, enum: [none, auto, required] }
            - { type: object }
        stream:
          type: boolean
          default: false
          description: "**NOT SUPPORTED** — the gateway uses a queue-based RPC pattern; every request returns one complete response object. A `true` value is ignored."
      additionalProperties: true
      description: |
        OpenAI-compatible chat completions request body. The gateway forwards
        the body as opaque JSON to the LLM worker (Aphrodite/vLLM/sglang),
        rewriting only the `model` field. Standard OpenAI pass-through params
        (`stop`, `seed`, `response_format`, `logprobs`, `tools`,
        `tool_choice`) are supported by the backend engine. `stream` is not
        supported today.

    ChatCompletionResponse:
      type: object
      required: [id, object, created, model, choices]
      properties:
        id: { type: string }
        object: { type: string, enum: [chat.completion] }
        created: { type: integer, format: int64 }
        model: { type: string }
        choices:
          type: array
          items:
            type: object
            properties:
              index: { type: integer }
              message: { $ref: "#/components/schemas/ChatMessage" }
              finish_reason: { type: string, enum: [stop, length, tool_calls, content_filter] }
        usage:
          type: object
          properties:
            prompt_tokens: { type: integer }
            completion_tokens: { type: integer }
            total_tokens: { type: integer }

    # ---- Embeddings ----
    EmbeddingRequest:
      type: object
      required: [model, input]
      properties:
        model:
          type: string
          examples: [qwen3-embed-4b]
        input:
          oneOf:
            - { type: string }
            - type: array
              items: { type: string }
          description: Text (or array of texts) to embed. For multimodal models, `input` may be a base64 data URI or URL when `modality` is `image`/`audio`.
        encoding_format:
          type: string
          enum: [float, base64]
          default: float
        dimensions:
          type: integer
          minimum: 1
          description: Infinity-engine Matryoshka dimensionality reduction. Default `0` = model's native dims. Omit for native dimensions.
        modality:
          type: string
          enum: [text, image, audio]
          default: text
          description: Infinity-engine input discriminator. When `image`/`audio`, `input` accepts URLs/base64 data URIs.
        user: { type: string, description: OpenAI-compatible end-user identifier (optional). }
      additionalProperties: true

    EmbeddingResponse:
      type: object
      required: [object, data, model, usage]
      properties:
        id: { type: string, description: Infinity includes an `id`; OpenAI omits it. }
        object: { type: string, enum: [list] }
        created: { type: integer, format: int64, description: Infinity includes `created`; OpenAI omits it. }
        data:
          type: array
          items:
            type: object
            properties:
              object: { type: string, enum: [embedding] }
              index: { type: integer }
              embedding:
                oneOf:
                  - type: array
                    items: { type: number }
                  - { type: string, description: base64-encoded floats when `encoding_format=base64`. }
        model: { type: string }
        usage:
          type: object
          properties:
            prompt_tokens: { type: integer }
            total_tokens: { type: integer }

    # ---- Rerank ----
    RerankRequest:
      type: object
      required: [model, query, documents]
      properties:
        model:
          type: string
          examples: [qwen3-rerank-0-6b]
        query: { type: string }
        documents:
          type: array
          items: { type: string }
          description: Document strings to rank against the query.
        top_n:
          type: integer
          minimum: 1
          description: Return only the top N results. Default = all.
        return_documents:
          type: boolean
          default: false
          description: Infinity — include the document text in each result.
        raw_scores:
          type: boolean
          default: false
          description: Infinity — return raw logits instead of normalized scores.
      additionalProperties: true

    RerankResponse:
      type: object
      required: [results]
      properties:
        id: { type: string, description: Infinity response id. }
        object: { type: string, enum: [rerank] }
        created: { type: integer, format: int64 }
        model: { type: string }
        results:
          type: array
          items:
            type: object
            required: [index, relevance_score]
            properties:
              index: { type: integer }
              relevance_score: { type: number }
              document:
                type: string
                description: Present when `return_documents=true`.
        usage:
          type: object
          properties:
            prompt_tokens: { type: integer }
            total_tokens: { type: integer }

    # ---- Shared audio options ----
    GenerationOptions:
      type: object
      description: Generation parameters for TTS / voice conversion. Most fields are model-specific; unsupported fields are silently ignored.
      properties:
        seed: { type: integer, nullable: true }
        style: { type: integer, nullable: true, description: Style index (model-dependent). }
        speed: { type: number, nullable: true }
        pitch: { type: number, nullable: true }
        energy: { type: number, nullable: true }
        exaggeration:
          type: number
          nullable: true
          description: "(Chatterbox) Emotion exaggeration factor (default 0.5)."
        cfg_weight:
          type: number
          nullable: true
          description: "(Chatterbox) Classifier-free guidance weight (default 0.5)."
        temperature:
          type: number
          nullable: true
          description: "(Chatterbox) Sampling temperature (default 0.8)."
        repetition_penalty:
          type: number
          nullable: true
          description: "(Chatterbox) Repetition penalty >1.0 reduces repetition (default 1.2)."
        top_p:
          type: number
          nullable: true
          description: "(Chatterbox) Top-p nucleus sampling probability."
        min_p:
          type: number
          nullable: true
          description: "(Chatterbox TTS/Multilingual) Minimum probability threshold (default 0.05)."
        top_k:
          type: integer
          nullable: true
          description: "(Chatterbox Turbo) Top-k sampling candidates (default 1000)."
        norm_loudness:
          type: boolean
          nullable: true
          description: "(Chatterbox Turbo) Apply pyloudnorm loudness normalization (default true)."
      additionalProperties: true

    OutputOptions:
      type: object
      description: Output audio format.
      properties:
        format:
          type: string
          enum: [wav, mp3, flac]
          default: wav
        sample_rate:
          type: integer
          nullable: true
          description: Resample output to this rate (Hz); null = model's native rate.
        stream:
          type: boolean
          default: false
          description: Reserved for future use.

    PreProcessingFilters:
      type: array
      description: Filters applied before synthesis/conversion. Each filter is itself an AudioConversionRequest-shaped opaque object (recursive filter chain).
      items:
        type: object
        additionalProperties: true

    # ---- TTS ----
    TTSRequest:
      type: object
      required: [model, input, mode]
      description: |
        Harmony Speech Engine TTS request. NOT OpenAI-shaped — requires `mode`,
        audio format via `output_options.format` (not `response_format`), and
        cloning via `input_audio`/`input_embedding`.
      properties:
        model:
          type: string
          description: TTS model or toolchain group (e.g. `kitten-tts-mini`, `chatterbox`, `openvoice_v2`).
        input:
          type: string
          description: Text to synthesize. `chatterbox_turbo` accepts paralinguistic tags inline.
        mode:
          type: string
          enum: [single_speaker_tts, voice_cloning]
          description: "`single_speaker_tts` skips VAD/embedding/tone-conversion; `voice_cloning` runs the full pipeline."
        language:
          type: string
          description: Language code — required only by multilingual models (`openvoice_v1/v2`, `chatterbox_multilingual`). See the catalog `speech_options.languages`.
        voice:
          type: string
          description: Preset voice ID — required when the model/language has preset voices.
        input_audio: { $ref: "#/components/schemas/Base64Audio" }
        input_embedding:
          allOf:
            - { $ref: "#/components/schemas/Base64Blob" }
          description: Pre-computed speaker embedding (faster than `input_audio`; skips VAD/embedding).
        input_vad_data:
          type: string
          description: VAD result JSON from `/v1/audio/vad`; skips the internal VAD step.
        input_vad_mode: { type: string, description: VAD engine hint (informational). }
        generation_options: { $ref: "#/components/schemas/GenerationOptions" }
        output_options: { $ref: "#/components/schemas/OutputOptions" }
        pre_processing_filters: { $ref: "#/components/schemas/PreProcessingFilters" }
        post_generation_filters:
          type: array
          description: Filters applied after synthesis (recursive filter chain).
          items:
            type: object
            additionalProperties: true
      additionalProperties: true

    AudioDataResponse:
      type: object
      required: [id, model, created, data]
      properties:
        id: { type: string }
        model: { type: string }
        created: { type: integer, format: int64 }
        data: { $ref: "#/components/schemas/Base64Blob" }

    # ---- STT ----
    STTRequest:
      type: object
      required: [model, input_audio]
      description: JSON-only (NOT multipart). Audio is base64-encoded inside the JSON body.
      properties:
        model:
          type: string
          examples: [faster-whisper-large-v3-turbo]
        input_audio: { $ref: "#/components/schemas/Base64Audio" }
        get_language:
          type: boolean
          default: false
          description: Return the detected source language tag.
        get_timestamps:
          type: boolean
          default: false
          description: Return word-level timestamps.
      additionalProperties: true

    STTResponse:
      type: object
      required: [id, model, created, text]
      properties:
        id: { type: string }
        model: { type: string }
        created: { type: integer, format: int64 }
        text: { type: string }
        language:
          type: string
          description: Present when `get_language=true`.
        timestamps:
          type: array
          description: Present when `get_timestamps=true`.
          items:
            type: object
            properties:
              word: { type: string }
              start: { type: number }
              end: { type: number }

    # ---- VAD ----
    VADRequest:
      type: object
      required: [model, input_audio]
      properties:
        model:
          type: string
          description: VAD model (`silero-vad`; `faster-whisper-*` also accepted but less precise).
        input_audio: { $ref: "#/components/schemas/Base64Audio" }
        get_timestamps:
          type: boolean
          default: false
        threshold:
          type: number
          nullable: true
          description: Detection sensitivity — Silero only (default 0.5).
        min_speech_duration_ms: { type: integer, nullable: true, description: Silero only (default 250). }
        min_silence_duration_ms: { type: integer, nullable: true, description: Silero only (default 100). }
        speech_pad_ms: { type: integer, nullable: true, description: Silero only (default 30). }
        return_seconds: { type: boolean, description: Silero only — return timestamps in seconds instead of ms. }
      additionalProperties: true

    VADResponse:
      type: object
      required: [id, model, created, speech_activity]
      properties:
        id: { type: string }
        model: { type: string }
        created: { type: integer, format: int64 }
        speech_activity: { type: boolean }
        timestamps:
          type: array
          description: Present when `get_timestamps=true`.
          items:
            type: object
            properties:
              start: { type: integer, description: ms (or seconds if `return_seconds=true`). }
              end: { type: integer }

    # ---- Speaker embedding ----
    SpeakerEmbedRequest:
      type: object
      required: [model, input_audio]
      properties:
        model:
          type: string
          description: Embedding-capable model (e.g. `harmonyspeech`, `chatterbox`, `openvoice_v1`, `openvoice_v2`).
        input_audio: { $ref: "#/components/schemas/Base64Audio" }
      additionalProperties: true

    # ---- Audio conversion ----
    AudioConversionRequest:
      type: object
      required: [model, source_audio]
      properties:
        model:
          type: string
          examples: [voicefixer]
        source_audio: { $ref: "#/components/schemas/Base64Audio" }
        output_options: { $ref: "#/components/schemas/OutputOptions" }
        pre_processing_filters: { $ref: "#/components/schemas/PreProcessingFilters" }
      additionalProperties: true

    # ---- Voice conversion ----
    VoiceConversionRequest:
      type: object
      required: [model, source_audio]
      description: At least one of `target_audio` or `target_embedding` is required.
      properties:
        model:
          type: string
          examples: [chatterbox_vc]
        source_audio: { $ref: "#/components/schemas/Base64Audio" }
        target_audio: { $ref: "#/components/schemas/Base64Audio" }
        target_embedding:
          allOf:
            - { $ref: "#/components/schemas/Base64Blob" }
          description: Pre-computed speaker embedding (faster than `target_audio`).
        generation_options: { $ref: "#/components/schemas/GenerationOptions" }
        output_options: { $ref: "#/components/schemas/OutputOptions" }
        pre_processing_filters: { $ref: "#/components/schemas/PreProcessingFilters" }
      additionalProperties: true

    # ---- Image generation (currently unavailable) ----
    ImageGenerationRequest:
      type: object
      required: [model, prompt]
      description: OpenAI-compatible image generation. Currently NOT served — no worker is deployed.
      deprecated: true
      properties:
        model: { type: string }
        prompt: { type: string }
        n: { type: integer, minimum: 1, default: 1 }
        size:
          type: string
          enum: ["256x256", "512x512", "1024x1024"]
          default: "1024x1024"
      additionalProperties: true

    # ---- OpenAPI self-download ----
    OpenAPISpec:
      type: object
      description: The full OpenAPI document (JSON or YAML). Served with `servers` rewritten to the caller's access domain.
      additionalProperties: true

# ===========================================================================
# Paths
# ===========================================================================
paths:
  # ---- Cloud API: Authentication (unauthenticated group) ----------------
  /v1/auth/register:
    post:
      tags: [Authentication]
      summary: Register a new account
      description: Creates a user (Argon2id password hash) and sends a verification email. Returns 202 (no token). Requires email verification before login.
      security: []
      servers:
        - url: https://beta.cloud.soulbits.app
        - url: https://cloud.soulbits.app
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password, minLength: 8 }
                display_name: { type: string }
      responses:
        "202":
          description: Account created; verification email sent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "400": { $ref: "#/components/responses/StandardError" }
        "409": { $ref: "#/components/responses/StandardError" }

  /v1/auth/login:
    post:
      tags: [Authentication]
      summary: Log in with email + password
      description: Requires `email_verified=true`. Returns PASETO + refresh token pair with `expires_at`.
      security: []
      servers:
        - url: https://beta.cloud.soulbits.app
        - url: https://cloud.soulbits.app
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        "200":
          description: Login successful.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }
        "400": { $ref: "#/components/responses/StandardError" }
        "401": { $ref: "#/components/responses/StandardError" }
        "403":
          description: Email not verified.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/auth/refresh:
    post:
      tags: [Authentication]
      summary: Refresh the PASETO token
      description: Rotates refresh tokens within a family; reuse detection revokes the entire family. The fresh PASETO uses the user's CURRENT `email_verified` status.
      security: []
      servers:
        - url: https://beta.cloud.soulbits.app
        - url: https://cloud.soulbits.app
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        "200":
          description: Refresh successful.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }
        "400": { $ref: "#/components/responses/StandardError" }
        "401": { $ref: "#/components/responses/StandardError" }

  /v1/auth/device/enroll:
    post:
      operationId: enrollDevice
      tags: [Authentication]
      summary: Redeem a delegated-enrollment grant for a device session
      description: >
        Exchanges a single-use delegated-enrollment grant for the enrolled
        device's OWN device-scoped session (PASETO + refresh token) — the same
        token shape every other sign-in path returns. NO account authentication
        is required: the grant is the credential. The device is registered as
        authorized because the minting device vouched for it. Enrolled devices
        are full devices and may themselves mint grants.
      security: []
      servers:
        - url: https://beta.cloud.soulbits.app
        - url: https://cloud.soulbits.app
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceEnrollRequest" }
      responses:
        "200":
          description: Enrolled; device-scoped session issued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }
        "400": { $ref: "#/components/responses/StandardError" }
        "401":
          description: 'Invalid, expired, or already-used grant — `error: enrollment_grant_invalid`.'
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/auth/verify:
    get:
      tags: [Authentication]
      summary: Verify email address
      description: Accepts the token as a URL path segment OR query param. Returns a token pair on success.
      security: []
      servers:
        - url: https://beta.cloud.soulbits.app
        - url: https://cloud.soulbits.app
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
          description: Hex verification token from the email link.
      responses:
        "200":
          description: Email verified.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }
        "400": { $ref: "#/components/responses/StandardError" }
        "404": { $ref: "#/components/responses/StandardError" }
        "410":
          description: Token expired.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/auth/resend-verification:
    post:
      tags: [Authentication]
      summary: Resend the verification email
      description: Per-user 60s cooldown; returns `Retry-After` header on 429.
      security: []
      servers:
        - url: https://beta.cloud.soulbits.app
        - url: https://cloud.soulbits.app
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "202":
          description: Verification email re-sent (or no such user — no enumeration).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "400": { $ref: "#/components/responses/StandardError" }
        "404": { $ref: "#/components/responses/StandardError" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/auth/password/reset/request:
    post:
      tags: [Authentication]
      summary: Request a password reset
      description: Always returns 202 (no user enumeration).
      security: []
      servers:
        - url: https://beta.cloud.soulbits.app
        - url: https://cloud.soulbits.app
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "202":
          description: Reset email sent if the account exists.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "400": { $ref: "#/components/responses/StandardError" }

  /v1/auth/password/reset/confirm:
    post:
      tags: [Authentication]
      summary: Confirm a password reset
      description: Writes a Valkey cutoff to invalidate all existing tokens (forces re-login).
      security: []
      servers:
        - url: https://beta.cloud.soulbits.app
        - url: https://cloud.soulbits.app
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, new_password]
              properties:
                token: { type: string }
                new_password: { type: string, format: password, minLength: 8 }
      responses:
        "200":
          description: Password reset.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "400": { $ref: "#/components/responses/StandardError" }
        "404": { $ref: "#/components/responses/StandardError" }
        "410":
          description: Token expired.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/auth/google:
    post:
      tags: [Authentication]
      summary: Google Sign-In (native / Android)
      description: Validates the Google `id_token`. 409 on email conflict (link flow).
      security: []
      servers:
        - url: https://beta.cloud.soulbits.app
        - url: https://cloud.soulbits.app
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id_token]
              properties:
                id_token: { type: string }
      responses:
        "200":
          description: Login successful.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }
        "400": { $ref: "#/components/responses/StandardError" }
        "401": { $ref: "#/components/responses/StandardError" }
        "409": { $ref: "#/components/responses/StandardError" }

  /v1/auth/google/web:
    post:
      tags: [Authentication]
      summary: Google Sign-In (web OAuth code flow)
      description: Exchanges an authorization code for an id_token server-side. PKCE optional.
      security: []
      servers:
        - url: https://beta.cloud.soulbits.app
        - url: https://cloud.soulbits.app
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [auth_code, redirect_uri]
              properties:
                auth_code: { type: string }
                redirect_uri: { type: string, format: uri }
                code_verifier: { type: string, description: PKCE verifier (optional). }
      responses:
        "200":
          description: Login successful.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }
        "400": { $ref: "#/components/responses/StandardError" }
        "401": { $ref: "#/components/responses/StandardError" }
        "409": { $ref: "#/components/responses/StandardError" }

  /v1/auth/apple:
    post:
      tags: [Authentication]
      summary: Apple Sign-In (native / iOS)
      description: Validates the Apple `identity_token` against Apple JWKS. 409 on email conflict (link flow).
      security: []
      servers:
        - url: https://beta.cloud.soulbits.app
        - url: https://cloud.soulbits.app
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identity_token]
              properties:
                identity_token: { type: string }
      responses:
        "200":
          description: Login successful.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }
        "400": { $ref: "#/components/responses/StandardError" }
        "401": { $ref: "#/components/responses/StandardError" }
        "409": { $ref: "#/components/responses/StandardError" }

  /v1/auth/apple/web:
    post:
      tags: [Authentication]
      summary: Apple Sign-In (web OAuth code flow)
      description: Exchanges an authorization `code` for an `id_token` at `https://appleid.apple.com/auth/token` using a per-request-minted `client_secret` JWT (ES256, signed with the Apple `.p8` key). 409 on email conflict (link flow).
      security: []
      servers:
        - url: https://beta.cloud.soulbits.app
        - url: https://cloud.soulbits.app
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, redirect_uri]
              properties:
                code: { type: string, description: Apple authorization code. }
                redirect_uri: { type: string, format: uri }
      responses:
        "200":
          description: Login successful.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }
        "400": { $ref: "#/components/responses/StandardError" }
        "401": { $ref: "#/components/responses/StandardError" }
        "409": { $ref: "#/components/responses/StandardError" }
        "503":
          description: Apple token endpoint unreachable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # ---- Cloud API: Protected auth/account/key endpoints ------------------
  /v1/auth/logout:
    post:
      tags: [Authentication]
      summary: Log out (revoke refresh tokens + PASETO cutoff)
      description: Revokes all refresh tokens by default (or a specific one if `refresh_token` is provided). Writes a Valkey cutoff for instant PASETO invalidation.
      security:
        - paseto: []
      servers:
        - url: https://beta.cloud.soulbits.app
        - url: https://cloud.soulbits.app
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token: { type: string, description: Optional — revoke only this token instead of all. }
      responses:
        "200":
          description: Logged out.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/auth/me:
    get:
      tags: [Account]
      summary: Get the current user profile
      security:
        - paseto: []
      servers:
        - url: https://beta.cloud.soulbits.app
        - url: https://cloud.soulbits.app
      responses:
        "200":
          description: Current user profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserProfile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/StandardError" }
    patch:
      tags: [Account]
      summary: Update the current user profile
      description: Partial update — `display_name` and `avatar_url` are mutable.
      security:
        - paseto: []
      servers:
        - url: https://beta.cloud.soulbits.app
        - url: https://cloud.soulbits.app
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [display_name]
              properties:
                display_name: { type: string }
                avatar_url:
                  type: string
                  description: Profile picture as a data URL (`data:image/...;base64,...`) or external URL. To remove the picture, send an empty string.
      responses:
        "200":
          description: Updated profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserProfile" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ---- Email change (five-stage) ---------------------------------------
  /v1/auth/email/change/request:
    post:
      tags: [Account]
      summary: Start an email change
      description: |
        Stage 1–2. Step-up with the account password, then stage a move to
        `new_email`.

        The change is confirmed from BOTH mailboxes: a token is mailed to the
        TARGET address first (stage 3), and only after that is a blocking
        approval token mailed to the CURRENT address naming the target
        (stage 4). Neither address can complete the change alone.

        Requires a password on the account. Google/Apple-created accounts have
        none and receive `403 password_required` — they must set a password
        first (`PUT /v1/auth/password`), after which the normal flow applies.
        This prevents the email change from silently minting a second credential
        on an account whose only credential is the provider link.

        New requests invalidate any still-pending one. A 60s per-user cooldown
        applies (`429`, with `retry_after`).
      security:
        - paseto: []
      servers:
        - url: https://beta.cloud.soulbits.app
        - url: https://cloud.soulbits.app
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_email]
              properties:
                current_password:
                  type: string
                  format: password
                  description: Current account password (step-up challenge).
                new_email: { type: string, format: email }
      responses:
        "202":
          description: |
            Change staged AND the confirmation email was accepted for delivery
            to the new address. A `202` is a promise that mail is on its way — if
            the hand-off fails this endpoint returns `500` instead, so clients
            should only tell the user to check their inbox on success.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "400":
          description: Missing/invalid fields.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Not authenticated, or the current password is incorrect.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: API keys cannot change the email, or the account has no password (`password_required`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: The address is already in use (`email_in_use`) or is already the account's address (`same_email`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: Per-user cooldown still active.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: |
            The change was staged but the confirmation email could not be sent.
            The request remains resumable (the new address can be confirmed, or
            the mail re-sent) — the staged token is not consumed here.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/auth/email/change/confirm-new:
    post:
      tags: [Account]
      summary: Confirm the new email address (stage 3)
      description: |
        Redeems the single-use token mailed to the TARGET address. On success a
        blocking approval email is sent to the CURRENT address naming the target.

        Must be called by the authenticated owner of the request — the emailed
        token is not sufficient on its own.
      security:
        - paseto: []
      servers:
        - url: https://beta.cloud.soulbits.app
        - url: https://cloud.soulbits.app
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200":
          description: New address confirmed; approval email sent to the current address.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "404": { $ref: "#/components/responses/StandardError" }
        "403": { $ref: "#/components/responses/StandardError" }
        "410": { $ref: "#/components/responses/StandardError" }

  /v1/auth/email/change/confirm:
    post:
      tags: [Account]
      summary: Approve and commit the email change (stage 5)
      description: |
        Redeems the single-use token mailed to the CURRENT address and commits
        the change. The previous address is retained for audit, and a Valkey
        cutoff signs out every session (the account owner must sign in again).

        Must be called by the authenticated owner of the request.
      security:
        - paseto: []
      servers:
        - url: https://beta.cloud.soulbits.app
        - url: https://cloud.soulbits.app
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200":
          description: Email changed; all sessions signed out.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "404": { $ref: "#/components/responses/StandardError" }
        "403": { $ref: "#/components/responses/StandardError" }
        "409":
          description: The new address has not been confirmed yet, or it was taken in the meantime (`email_in_use`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "410": { $ref: "#/components/responses/StandardError" }

  /v1/auth/email/change/resend:
    post:
      tags: [Account]
      summary: Re-send the current step's confirmation email
      description: |
        Recovery path for "the confirmation email never arrived" (spam, a typo'd
        forward, or a failed hand-off).

        Re-mints the token for whichever stage the change is CURRENTLY on and
        re-sends only that one email. It never advances the flow: the approval
        (stage 4) branch is unreachable until the new address has confirmed, so
        this cannot be used to skip stage 3. The previously issued link for that
        stage stops working, as the newest token replaces it.

        Rate-limited to one resend per 60 s (`429` with `retry_after`), matching
        the per-user cooldown on starting a change.
      security:
        - paseto: []
      servers:
        - url: https://beta.cloud.soulbits.app
        - url: https://cloud.soulbits.app
      responses:
        "200":
          description: Confirmation email re-sent for the current stage.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/StandardError" }
        "404":
          description: No pending change (`no_pending_change`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: Resend cooldown still active.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/auth/email/change/cancel:
    post:
      tags: [Account]
      summary: Cancel a pending email change
      description: |
        Abandons a pending change so a different address can be used immediately
        — the "I typed the wrong address" / "I changed my mind" case — instead of
        the request blocking a new attempt until it expires.

        Voids BOTH tokens (including any link already delivered), because it sets
        the same single-use tombstone every confirmation lookup guards on.
        Idempotent: cancelling when nothing is pending returns 200.
      security:
        - paseto: []
      servers:
        - url: https://beta.cloud.soulbits.app
        - url: https://cloud.soulbits.app
      responses:
        "200":
          description: Cancelled (or nothing was pending).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/StandardError" }

  /v1/auth/email/change/status:
    get:
      tags: [Account]
      summary: Current email-change state
      description: Reports whether a pending change exists and which step it awaits, so the portal can resume after a reload.
      security:
        - paseto: []
      servers:
        - url: https://beta.cloud.soulbits.app
        - url: https://cloud.soulbits.app
      responses:
        "200":
          description: Pending-change state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmailChangeStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/StandardError" }

  # ---- Active sessions -------------------------------------------------
  /v1/auth/sessions:
    get:
      tags: [Account]
      summary: List active sessions
      description: |
        Every signed-in session for the account — one per device or browser —
        most recently active first, with the calling session marked `current`.

        Signing out one session (`DELETE /v1/auth/sessions/{session_id}`) kills
        that session's tokens immediately, not just its refresh token.
      security:
        - paseto: []
      servers:
        - url: https://beta.cloud.soulbits.app
        - url: https://cloud.soulbits.app
      responses:
        "200":
          description: Active sessions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionListResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/StandardError" }
    delete:
      tags: [Account]
      summary: Sign out everywhere
      description: |
        Ends EVERY session for the account, including the calling one. The
        caller must sign in again afterwards; this is the deliberate "sign out
        everywhere" action (the same invalidation the email-change flow applies
        on commit).
      security:
        - paseto: []
      servers:
        - url: https://beta.cloud.soulbits.app
        - url: https://cloud.soulbits.app
      responses:
        "200":
          description: All sessions ended.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RevokeAllSessionsResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/StandardError" }

  /v1/auth/sessions/{session_id}:
    delete:
      tags: [Account]
      summary: Sign out one session
      description: |
        Ends a single session — one device or browser. Refused for the calling
        session (`400 cannot_revoke_current_session`), which must be ended with
        `POST /v1/auth/logout` so the client knows it has been signed out.
      security:
        - paseto: []
      servers:
        - url: https://beta.cloud.soulbits.app
        - url: https://cloud.soulbits.app
      parameters:
        - name: session_id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: Session identifier from `GET /v1/auth/sessions`.
      responses:
        "204":
          description: Session ended.
        "400": { $ref: "#/components/responses/StandardError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/StandardError" }
        "404": { $ref: "#/components/responses/StandardError" }

  /v1/auth/identities:
    get:
      tags: [Account]
      summary: List linked sign-in providers
      description: |
        Returns the OAuth providers (Google, Apple) attached to the account so
        the portal can offer a disconnect action. Disconnecting uses
        `DELETE /v1/auth/link/{google,apple}`, which refuses while the account
        has no password (lockout guard).

        The synthetic `email` identity from registration is not listed.
      security:
        - paseto: []
      servers:
        - url: https://beta.cloud.soulbits.app
        - url: https://cloud.soulbits.app
      responses:
        "200":
          description: Linked providers (possibly empty).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LinkedIdentity" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/StandardError" }

  /v1/auth/password:
    put:
      tags: [Account]
      summary: Change password
      description: |
        Changes the authenticated user's password and writes a Valkey cutoff
        (forces re-login everywhere). `old_password` is required and verified.

        Accounts created via Google/Apple Sign-In have NO password, so they
        cannot use this endpoint — setting a FIRST password creates a credential
        and is gated behind an email-confirmed, session-bound flow
        (`POST /v1/auth/password/setup/request` → `.../confirm`). A password-less
        account receives `409 password_setup_required`.
      security:
        - paseto: []
      servers:
        - url: https://beta.cloud.soulbits.app
        - url: https://cloud.soulbits.app
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [old_password, new_password]
              properties:
                old_password:
                  type: string
                  format: password
                  description: Current password. Required and verified.
                new_password: { type: string, format: password, minLength: 8 }
      responses:
        "200":
          description: Password changed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "400":
          description: Invalid request — missing/new-password validation failure, or `old_password` omitted.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/StandardError" }
        "409":
          description: The account has no password yet (`password_setup_required`) — use the first-password setup flow.

  /v1/auth/password/setup/request:
    post:
      tags: [Account]
      summary: Request first-password setup (OAuth-only accounts)
      description: |
        Stages a single-use token and mails it to the account's OWN address. The
        password is only set when the token is redeemed via
        `POST /v1/auth/password/setup/confirm` by an authenticated caller, so a
        stolen session token alone can never create a credential.

        Refused with `409 password_already_set` when the account already has a
        password (use `PUT /v1/auth/password` instead). Refused with `403` for
        API-key callers.
      security:
        - paseto: []
      servers:
        - url: https://beta.cloud.soulbits.app
        - url: https://cloud.soulbits.app
      responses:
        "202":
          description: Setup email sent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/StandardError" }
        "409":
          description: The account already has a password (`password_already_set`).

  /v1/auth/password/setup/confirm:
    post:
      tags: [Account]
      summary: Confirm first-password setup
      description: |
        Redeems the token mailed by `POST /v1/auth/password/setup/request` and
        sets the first password. The caller must be authenticated as the request
        owner (the token is session-bound), so a forwarded or leaked mail alone
        is not sufficient. Writes a Valkey cutoff (forces re-login everywhere).
      security:
        - paseto: []
      servers:
        - url: https://beta.cloud.soulbits.app
        - url: https://cloud.soulbits.app
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, new_password]
              properties:
                token: { type: string }
                new_password: { type: string, format: password, minLength: 8 }
      responses:
        "200":
          description: Password set.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "400": { $ref: "#/components/responses/StandardError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/StandardError" }
        "404": { $ref: "#/components/responses/StandardError" }
        "409":
          description: The account already has a password (`password_already_set`).
        "410":
          description: Token expired.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/auth/account:
    delete:
      tags: [Account]
      summary: Request permanent deletion of the current user's account (email-confirmed)
      description: |
        STAGES a permanent account deletion — it does NOT delete anything yet.
        Because deletion is irreversible, it is gated behind proof of control of
        the account's OWN mailbox: this call validates the typed confirmation
        (`"confirm":"DELETE"`) plus a step-up credential and mails a single-use
        confirmation link to the account address. The deletion commits only when
        that link is redeemed via `POST /v1/auth/account/confirm` by an
        authenticated caller, so a stolen session alone cannot destroy the
        account.

        Step-up (verified when supplied): `current_password` for passworded
        accounts, or `confirm_email` (the user re-typing the account address) for
        passwordless Google/Apple accounts. The emailed link is the mandatory
        hard confirmation for every account.

        On commit, the user's CLOUD data is purged first (live sessions killed,
        every S3 version under `{userID}/` deleted, the per-user DEK deleted),
        then the user row is hard-deleted (DB `ON DELETE CASCADE` removes API
        keys, refresh tokens, devices, themes, subscriptions, sessions,
        identities and email/password-reset tokens).
      security:
        - paseto: []
      servers:
        - url: https://beta.cloud.soulbits.app
        - url: https://cloud.soulbits.app
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm:
                  type: string
                  description: Must be exactly `"DELETE"`.
                current_password:
                  type: string
                  description: Step-up password (passworded accounts).
                confirm_email:
                  type: string
                  description: Re-typed account email (passwordless Google/Apple accounts).
      responses:
        "202":
          description: Deletion staged; a confirmation link was emailed to the account address.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "400":
          description: Confirmation missing/incorrect, or `confirm_email` did not match.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: API keys cannot delete the account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: The confirmation email could not be sent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/auth/account/confirm:
    post:
      tags: [Account]
      summary: Confirm and commit a staged account deletion
      description: |
        Redeems the single-use token mailed to the account address and permanently
        deletes the account. The token is bound to the authenticated caller, so a
        forwarded or leaked email alone cannot delete the account. The deletion
        itself is a single synchronous database transaction (every account-scoped
        row is removed via FK cascade); the deleted user's hosted-backup blobs in
        s3-sync-backup are purged asynchronously afterwards. Irreversible.
      security:
        - paseto: []
      servers:
        - url: https://beta.cloud.soulbits.app
        - url: https://cloud.soulbits.app
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  description: The single-use token from the confirmation email.
      responses:
        "202":
          description: >
            Account deleted. The database deletion is committed and final; residual
            best-effort cleanup (the async S3 purge of the user's hosted-backup
            blobs) may still be in flight — do not wait or retry for it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "400":
          description: Token missing.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: API keys cannot delete the account, or the link belongs to a different account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Invalid or already-used confirmation link.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "410":
          description: The confirmation link has expired.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/account/backup-key:
    put:
      tags: [Account]
      summary: Escrow (or replace) the account's wrapped backup key (W1)
      description: |
        Stores a single opaque, client-wrapped backup-key blob for the account
        (2-6's W1 account escrow). The backend never generates, derives or
        inspects key material: it escrows the blob under a KMS-managed KEK
        (envelope). Scope is deliberately narrow — blob only, ≤1 KiB decoded —
        so this can never become a bulk-storage endpoint. PASETO (interactive)
        only; API keys are refused. Re-escrowing replaces the previous blob.
      security:
        - paseto: []
      servers:
        - url: https://beta.cloud.soulbits.app
        - url: https://cloud.soulbits.app
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BackupKeyPutRequest" }
      responses:
        "200":
          description: Escrowed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupKeyStatus" }
        "400":
          description: Missing or non-base64 `wrapped_key`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: API keys cannot access the backup-key escrow.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413":
          description: The decoded wrapped-key blob exceeds the 1 KiB limit.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: Escrow unavailable (no KMS configured).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    get:
      tags: [Account]
      summary: Fetch the account's escrowed wrapped backup key (W1)
      description: |
        Returns the account's escrowed wrapped-key blob for restore (2-6). 404
        when no key is escrowed. PASETO (interactive) only.
      security:
        - paseto: []
      servers:
        - url: https://beta.cloud.soulbits.app
        - url: https://cloud.soulbits.app
      responses:
        "200":
          description: The escrowed wrapped-key blob.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupKeyResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: API keys cannot access the backup-key escrow.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No backup key is escrowed for this account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: Escrow unavailable (no KMS configured).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [Account]
      summary: Drop the account's escrowed backup key (W1)
      description: |
        Removes the account's escrowed wrapped-key blob. Idempotent. Used by
        the account-deletion rework (6-2) and by a user-initiated "reset backup
        key". PASETO (interactive) only.
      security:
        - paseto: []
      servers:
        - url: https://beta.cloud.soulbits.app
        - url: https://cloud.soulbits.app
      responses:
        "200":
          description: Deleted (or already absent).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupKeyStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: API keys cannot access the backup-key escrow.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: Escrow unavailable (no KMS configured).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/account/sync-key:
    put:
      tags: [Account]
      summary: Escrow (or replace) the account's wrapped sync-group key (7-4)
      description: |
        Stores a single opaque, client-wrapped sync-group-key blob for the
        account (the second escrow slot beside the backup key, 7-2's sync-group
        key). The backend never generates, derives or inspects key material: it
        escrows the blob under a KMS-managed KEK (envelope). Scope is
        deliberately narrow — blob only, ≤1 KiB decoded. PASETO (interactive)
        only; API keys are refused. Re-escrowing replaces the previous blob.
      security:
        - paseto: []
      servers:
        - url: https://beta.cloud.soulbits.app
        - url: https://cloud.soulbits.app
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SyncKeyPutRequest" }
      responses:
        "200":
          description: Escrowed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncKeyStatus" }
        "400":
          description: Missing or non-base64 `wrapped_key`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: API keys cannot access the sync key escrow.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413":
          description: The decoded wrapped-key blob exceeds the 1 KiB limit.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: Escrow unavailable (no KMS configured).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    get:
      tags: [Account]
      summary: Fetch the account's escrowed wrapped sync-group key (7-4)
      description: |
        Returns the account's escrowed wrapped sync-group-key blob so a joining
        device can unwrap it (7-2/7-3). 404 when no key is escrowed. PASETO
        (interactive) only.
      security:
        - paseto: []
      servers:
        - url: https://beta.cloud.soulbits.app
        - url: https://cloud.soulbits.app
      responses:
        "200":
          description: The escrowed wrapped sync-group-key blob.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncKeyResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: API keys cannot access the sync key escrow.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No sync key is escrowed for this account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: Escrow unavailable (no KMS configured).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [Account]
      summary: Drop the account's escrowed sync-group key (7-4)
      description: |
        Removes the account's escrowed wrapped sync-group-key blob. Idempotent.
        Used when all devices are revoked and the group restarts fresh. PASETO
        (interactive) only.
      security:
        - paseto: []
      servers:
        - url: https://beta.cloud.soulbits.app
        - url: https://cloud.soulbits.app
      responses:
        "200":
          description: Deleted (or already absent).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncKeyStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: API keys cannot access the sync key escrow.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: Escrow unavailable (no KMS configured).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/account/sync-rotation-required:
    get:
      tags: [Account]
      summary: Read the account's sync rotation-required flag (7-4)
      description: |
        Whether a sync-key rotation is pending. Defaults to `false`. The app
        polls this and, when true, drives the engine's engine-authoritative
        rotate and re-escrows the new wrapped key. PASETO (interactive) only.
      security:
        - paseto: []
      servers:
        - url: https://beta.cloud.soulbits.app
        - url: https://cloud.soulbits.app
      responses:
        "200":
          description: The rotation-required flag.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncRotationStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: API keys cannot access the sync rotation flag.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: Rotation flag unavailable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    put:
      tags: [Account]
      summary: Set the account's sync rotation-required flag (7-4)
      description: |
        The portal sets `{"required": true}` ("Reset sync key") to flag a pending
        rotation; `{"required": false}` clears it. The portal never sees key
        material. PASETO (interactive) only.
      security:
        - paseto: []
      servers:
        - url: https://beta.cloud.soulbits.app
        - url: https://cloud.soulbits.app
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SyncRotationPutRequest" }
      responses:
        "200":
          description: Flag updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncRotationStatus" }
        "400":
          description: Missing `required`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: API keys cannot access the sync rotation flag.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: Rotation flag unavailable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [Account]
      summary: Clear the account's sync rotation-required flag (7-4)
      description: |
        Clears the flag after the app has rotated the engine key and re-escrowed
        it. Idempotent. PASETO (interactive) only.
      security:
        - paseto: []
      servers:
        - url: https://beta.cloud.soulbits.app
        - url: https://cloud.soulbits.app
      responses:
        "200":
          description: Flag cleared.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncRotationStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: API keys cannot access the sync rotation flag.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: Rotation flag unavailable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/auth/link/google:
    post:
      tags: [Authentication]
      summary: Link a Google identity to the current account
      description: 409 if already linked to a different user.
      security:
        - paseto: []
      servers:
        - url: https://beta.cloud.soulbits.app
        - url: https://cloud.soulbits.app
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id_token]
              properties:
                id_token: { type: string }
      responses:
        "200":
          description: Linked.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/StandardError" }
    delete:
      tags: [Authentication]
      summary: Unlink the Google identity
      description: |
        Lockout guard — refuses with `403 password_required` if the account has
        no password, because the provider link would then be its only credential.
        Set a password first (`PUT /v1/auth/password`).
      security:
        - paseto: []
      servers:
        - url: https://beta.cloud.soulbits.app
        - url: https://cloud.soulbits.app
      responses:
        "204":
          description: Unlinked.
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/auth/link/apple:
    post:
      tags: [Authentication]
      summary: Link an Apple identity to the current account
      description: Validates the `identity_token` against Apple JWKS. 409 if already linked to a different user.
      security:
        - paseto: []
      servers:
        - url: https://beta.cloud.soulbits.app
        - url: https://cloud.soulbits.app
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identity_token]
              properties:
                identity_token: { type: string }
      responses:
        "200":
          description: Linked.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/StandardError" }
    delete:
      tags: [Authentication]
      summary: Unlink the Apple identity
      description: |
        Lockout guard — refuses with `403 password_required` if the account has
        no password, because the provider link would then be its only credential.
        Set a password first (`PUT /v1/auth/password`).
      security:
        - paseto: []
      servers:
        - url: https://beta.cloud.soulbits.app
        - url: https://cloud.soulbits.app
      responses:
        "204":
          description: Unlinked.
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ---- API Keys (PASETO only) ------------------------------------------
  /v1/auth/api-keys:
    post:
      tags: [API Keys]
      summary: Create an API key
      description: |
        Returns the full key ONCE. Max 5 keys per user.
        API keys CANNOT create/list/delete other API keys.
      security:
        - paseto: []
      servers:
        - url: https://beta.cloud.soulbits.app
        - url: https://cloud.soulbits.app
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, description: Human-readable key label. }
      responses:
        "201":
          description: API key created (full key shown only here).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/APIKeyCreated" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: Maximum active keys reached.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    get:
      tags: [API Keys]
      summary: List API keys
      description: Returns metadata only — the raw key value is NEVER returned (only the prefix for identification).
      security:
        - paseto: []
      servers:
        - url: https://beta.cloud.soulbits.app
        - url: https://cloud.soulbits.app
      responses:
        "200":
          description: API keys for the current user.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/APIKeyListItem" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/auth/api-keys/{id}:
    delete:
      tags: [API Keys]
      summary: Delete an API key
      description: |
        Permanently deletes an API key. The key disappears from the list, can never
        authenticate again, and no longer counts towards the 5-key limit. Idempotent
        (deleting an unknown or already-deleted key returns 204). Purges the positive
        auth-cache entry and writes a negative Valkey cache entry so the key stops
        working within milliseconds.
      security:
        - paseto: []
      servers:
        - url: https://beta.cloud.soulbits.app
        - url: https://cloud.soulbits.app
      parameters:
        - $ref: "#/components/parameters/ApiKeyId"
      responses:
        "204":
          description: Deleted (or the key did not exist / was already deleted).
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/versions:
    get:
      tags: [Versions]
      summary: List available HL image versions
      servers:
        - url: https://beta.cloud.soulbits.app
        - url: https://cloud.soulbits.app
      responses:
        "200":
          description: Available versions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VersionsResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ---- Devices ----------------------------------------------------------
  /v1/devices:
    post:
      operationId: registerDevice
      tags: [Devices]
      summary: Register or refresh a device
      description: |
        Registers a client install (or refreshes an existing one, e.g. a new
        push token). Devices are authorized via the `/v1/devices/authorize`
        email auth-code flow.
      security:
        - paseto: []
      servers:
        - url: https://beta.cloud.soulbits.app
        - url: https://cloud.soulbits.app
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterDeviceRequest" }
      responses:
        "200":
          description: Device registered (or refreshed).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Device" }
        "400": { $ref: "#/components/responses/StandardError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    get:
      operationId: listDevices
      tags: [Devices]
      summary: List the caller's devices
      description: Returns the current user's registered devices (no `user_id` per item — they are all the caller's).
      security:
        - paseto: []
      servers:
        - url: https://beta.cloud.soulbits.app
        - url: https://cloud.soulbits.app
      responses:
        "200":
          description: Devices registered to the current user.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DeviceListItem" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/devices/{device_id}:
    delete:
      operationId: revokeDevice
      tags: [Devices]
      summary: Revoke a device
      description: Revokes a device's authorization and removes it from the user's device list.
      security:
        - paseto: []
      servers:
        - url: https://beta.cloud.soulbits.app
        - url: https://cloud.soulbits.app
      parameters:
        - name: device_id
          in: path
          required: true
          schema: { type: string }
          description: Device identifier to revoke.
      responses:
        "204":
          description: Device revoked.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: 'Device not registered for this user — `error: device_not_registered` (the app re-registers and retries once).'
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/devices/authorize:
    post:
      operationId: authorizeDevice
      tags: [Devices]
      summary: Request an email auth code + approval link, or verify a code
      description: >
        Without `code`: mails the user a 6-digit code (fallback manual entry)
        AND an approval button linking to the portal device-approve page.
        Returns 202. With `code`: verifies the code and marks the device
        authorized. Returns 200.
      security:
        - paseto: []
      servers:
        - url: https://beta.cloud.soulbits.app
        - url: https://cloud.soulbits.app
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuthorizeDeviceRequest" }
      responses:
        "202":
          description: Auth code + approval link emailed — device authorization pending.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "200":
          description: Code verified — device authorized.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "400": { $ref: "#/components/responses/StandardError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: 'Device not registered for this user — `error: device_not_registered` (the app re-registers and retries once).'
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/devices/approve:
    post:
      operationId: approveDevice
      tags: [Devices]
      summary: Approve a device via emailed approval token
      description: >
        Redeems the high-entropy approval token from the email button URL.
        The authenticated session user must match the user the token was
        issued for. Marks the device authorized and consumes both pending
        secrets (code and token).
      security:
        - paseto: []
      servers:
        - url: https://beta.cloud.soulbits.app
        - url: https://cloud.soulbits.app
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApproveDeviceRequest" }
      responses:
        "200":
          description: Device approved and authorized.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApproveDeviceResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/StandardError" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/devices/authorize/status:
    get:
      operationId: getDeviceAuthorizationStatus
      tags: [Devices]
      summary: Poll device authorization state
      description: |
        App-polling endpoint for the device auth flow. Returns whether the
        device is authorized and whether a code/token pair is still
        outstanding for it.
      security:
        - paseto: []
      servers:
        - url: https://beta.cloud.soulbits.app
        - url: https://cloud.soulbits.app
      parameters:
        - name: device_id
          in: query
          required: true
          schema: { type: string }
          description: Device identifier to poll.
      responses:
        "200":
          description: Current device authorization state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceAuthorizationStatus" }
        "400": { $ref: "#/components/responses/StandardError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: 'Device not registered for this user — `error: device_not_registered` (the app re-registers and retries once).'
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # ---- Sync (Phase 7-1) -------------------------------------------------
  # The relay is a data-blind transport: it never reads frame/backup payloads
  # (all engine-encrypted). The WebSocket channel (/v1/sync/ws) is out of scope
  # for this REST-only spec — see docs/sync-relay-threat-model.md.
  /v1/devices/sync-pairing:
    post:
      operationId: mintSyncPairingToken
      tags: [Sync]
      summary: Mint a single-use sync pairing token
      description: >
        Mints a short-lived (5 min), single-use token binding (user, device,
        dataset). The engine presents it to the sync-relay at first connect
        (WebSocket `?pairing=` or POST /v1/sync/pairing/consume) to join a
        dataset group. The device must belong to the caller and be authorized.
      security:
        - paseto: []
      servers:
        - url: https://beta.cloud.soulbits.app
        - url: https://cloud.soulbits.app
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SyncPairingRequest" }
      responses:
        "201":
          description: Pairing token minted (shown once).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncPairingResponse" }
        "400": { $ref: "#/components/responses/StandardError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: 'Device not authorized — `error: device_not_authorized`.'
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: 'Device not registered for this user — `error: device_not_registered`.'
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # ---- Device enrollment: delegated enrollment grants (Phase 7-15) ------
  /v1/devices/enrollment-grants:
    post:
      operationId: mintEnrollmentGrant
      tags: [Devices]
      summary: Mint a single-use delegated-enrollment grant
      description: >
        Mints a short-lived (5 min), single-use grant that lets an
        already-authorized device (the desktop vouches) enroll a NEW device
        into the same account. The minting device must belong to the caller
        and be authorized. The grant is shown ONCE (only its SHA-256 is
        stored). Requires an interactive session — API keys are refused.
      security:
        - paseto: []
      servers:
        - url: https://beta.cloud.soulbits.app
        - url: https://cloud.soulbits.app
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnrollmentGrantRequest" }
      responses:
        "201":
          description: Enrollment grant minted (shown once).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnrollmentGrantResponse" }
        "400": { $ref: "#/components/responses/StandardError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: 'Minting device not authorized — `error: device_not_authorized` (API keys are also refused).'
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: 'Device not registered for this user — `error: device_not_registered`.'
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # ---- Device connect sessions: portal-mediated engine sign-in (7-15 C2) ----
  /v1/devices/connect-session:
    post:
      operationId: createDeviceConnectSession
      tags: [Devices]
      summary: Create a poll-only engine sign-in (connect session)
      description: >
        Public (the engine is not authenticated yet). Mints an unguessable
        connect_id + a once-shown 256-bit session_secret (SHA-256 at rest) and
        returns the portal URL the engine opens in the system browser. The user
        signs in there and clicks Allow; the engine then polls
        GET /v1/devices/connect-session/{connect_id} with the secret.
      security: []
      servers:
        - url: https://beta.cloud.soulbits.app
        - url: https://cloud.soulbits.app
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceConnectSessionRequest" }
      responses:
        "201":
          description: Connect session created (session_secret shown once).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceConnectSessionResponse" }
        "400": { $ref: "#/components/responses/StandardError" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/devices/connect-session/{connect_id}:
    get:
      operationId: getDeviceConnectSession
      tags: [Devices]
      summary: Poll a connect session (auth = the session_secret)
      description: >
        The engine polls this with `Authorization: Bearer <session_secret>`. A
        pending session returns `{"status":"pending"}`; an approved one returns
        the token pair EXACTLY ONCE (`{"status":"approved","token":…,
        "refresh_token":…,"expires_at":…}`) and is marked consumed; later polls
        return `{"status":"consumed"}`; an expired session returns
        `{"status":"expired"}`.
      security: []
      servers:
        - url: https://beta.cloud.soulbits.app
        - url: https://cloud.soulbits.app
      parameters:
        - name: connect_id
          in: path
          required: true
          schema: { type: string }
          description: The connect_id from the create response.
      responses:
        "200":
          description: Current connect-session state (token pair only on the approved transition).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceConnectStatusResponse" }
        "401":
          description: 'Missing or wrong session secret — `error: authentication required` / `invalid session secret`.'
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/devices/connect-session/{connect_id}/meta:
    get:
      operationId: getDeviceConnectSessionMeta
      tags: [Devices]
      summary: Read connect-session metadata (no secret)
      description: >
        No-secret read for the portal page: the device name to render plus the
        current status. The connect_id is a 128-bit unguessable UUID.
      security: []
      servers:
        - url: https://beta.cloud.soulbits.app
        - url: https://cloud.soulbits.app
      parameters:
        - name: connect_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Device name + status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceConnectMetaResponse" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/devices/connect-session/{connect_id}/approve:
    post:
      operationId: approveDeviceConnectSession
      tags: [Devices]
      summary: Approve a connect session (the portal Allow click)
      description: >
        Portal (interactive) auth ONLY — API keys are refused. The Allow click is
        the consent: it registers the device authorized=true and stores the
        freshly issued token pair (encrypted) for one-time retrieval by the
        engine's poll. Idempotent once approved.
      security:
        - paseto: []
      servers:
        - url: https://beta.cloud.soulbits.app
        - url: https://cloud.soulbits.app
      parameters:
        - name: connect_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Approved ({"status":"ok"}).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceConnectApproveResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: 'API keys are refused — `error: API keys cannot approve connect sessions`.'
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410":
          description: 'Connect session expired — `error: connect_session_expired`.'
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/sync/pairing/consume:
    post:
      operationId: consumeSyncPairingToken
      tags: [Sync]
      summary: Redeem a single-use sync pairing token
      description: >
        Atomically consumes a pairing token and joins the caller's device to the
        dataset group (enforcing the tier `sync_devices` limit). A token can be
        consumed exactly once.
      security:
        - paseto: []
      servers:
        - url: https://beta.cloud.soulbits.app
        - url: https://cloud.soulbits.app
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
                device_id: { type: string }
      responses:
        "200":
          description: Pairing token consumed; the device joined the dataset group.
          content:
            application/json:
              schema:
                type: object
                properties:
                  dataset_id: { type: string }
                  device_id: { type: string }
        "400": { $ref: "#/components/responses/StandardError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/StandardError" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/sync/status:
    get:
      operationId: getSyncStatus
      tags: [Sync]
      summary: Get the caller's sync buffer + quota status
      security:
        - paseto: []
      servers:
        - url: https://beta.cloud.soulbits.app
        - url: https://cloud.soulbits.app
      parameters:
        - name: dataset_id
          in: query
          required: true
          schema: { type: string }
        - name: device_id
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Buffer/quota status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncStatus" }
        "400": { $ref: "#/components/responses/StandardError" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/backup/objects/{sha256}:
    put:
      operationId: putBackupObject
      tags: [Sync]
      summary: Store an opaque, content-addressed backup object (7-5)
      description: >
        Body is an opaque, already-encrypted AEAD blob. The relay verifies only
        the SHA-256 address (integrity), never the content. Enforces the tier
        `backup_storage_mb` cap.
      security:
        - paseto: []
      servers:
        - url: https://beta.cloud.soulbits.app
        - url: https://cloud.soulbits.app
      parameters:
        - name: sha256
          in: path
          required: true
          schema: { type: string }
          description: Lowercase hex SHA-256 of the object body.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Object stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupPutResponse" }
        "400":
          description: 'Invalid sha256 or checksum mismatch — `error: invalid_sha256` / `checksum_mismatch`.'
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { $ref: "#/components/responses/StandardError" }
        "429": { $ref: "#/components/responses/RateLimited" }
    get:
      operationId: getBackupObject
      tags: [Sync]
      summary: Fetch an opaque backup object by its SHA-256
      security:
        - paseto: []
      servers:
        - url: https://beta.cloud.soulbits.app
        - url: https://cloud.soulbits.app
      parameters:
        - name: sha256
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The object body (application/octet-stream).
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/StandardError" }

  /v1/backup/manifest/{device}:
    put:
      operationId: putBackupManifest
      tags: [Sync]
      summary: Store an opaque per-device backup manifest (7-5)
      security:
        - paseto: []
      servers:
        - url: https://beta.cloud.soulbits.app
        - url: https://cloud.soulbits.app
      parameters:
        - name: device
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Manifest stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupPutResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { $ref: "#/components/responses/StandardError" }
        "429": { $ref: "#/components/responses/RateLimited" }
    get:
      operationId: getBackupManifest
      tags: [Sync]
      summary: Fetch an opaque per-device backup manifest
      security:
        - paseto: []
      servers:
        - url: https://beta.cloud.soulbits.app
        - url: https://cloud.soulbits.app
      parameters:
        - name: device
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The manifest body (application/octet-stream).
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/StandardError" }

  # ---- Subscription -----------------------------------------------------
  /v1/subscription/tiers:
    get:
      tags: [Subscription]
      summary: List subscription tiers
      security: []
      servers:
        - url: https://beta.cloud.soulbits.app
        - url: https://cloud.soulbits.app
      responses:
        "200":
          description: All subscription tiers.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Tier" }

  /v1/subscription/me:
    get:
      tags: [Subscription]
      summary: Get the current user's subscription
      description: Resolves the tier from the auth context; defaults to `free` if no subscription exists.
      servers:
        - url: https://beta.cloud.soulbits.app
        - url: https://cloud.soulbits.app
      responses:
        "200":
          description: Current subscription.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubscriptionMe" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ---- OpenAPI self-download -------------------------------------------
  /v1/openapi.yaml:
    get:
      tags: [OpenAPI]
      summary: Download this OpenAPI specification (YAML)
      description: |
        Serves the embedded OpenAPI 3.1 document in YAML. The `servers` array
        is rewritten to reflect the domain you accessed this endpoint from
        (`beta.*` preserved, `project-harmony.ai` legacy mapped to canonical
        `soulbits.app`, localhost passed through for dev). Public (no auth)
        to aid tooling (Postman, IDE import, code generation).
      security: []
      servers:
        - url: https://beta.cloud.soulbits.app
        - url: https://cloud.soulbits.app
      responses:
        "200":
          description: The OpenAPI document (YAML).
          content:
            application/yaml:
              schema: { $ref: "#/components/schemas/OpenAPISpec" }

  /v1/openapi.json:
    get:
      tags: [OpenAPI]
      summary: Download this OpenAPI specification (JSON)
      description: Same as `/v1/openapi.yaml` but JSON-encoded.
      security: []
      servers:
        - url: https://beta.cloud.soulbits.app
        - url: https://cloud.soulbits.app
      responses:
        "200":
          description: The OpenAPI document (JSON).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpenAPISpec" }

  # ---- Inference API: Models (public) ----------------------------------
  /v1/models:
    get:
      tags: [Models]
      summary: List available models
      description: Public (no auth). Returns all active models with metadata. Supports OpenRouter-style superset modality filters.
      security: []
      servers:
        - url: https://beta.api.soulbits.app
        - url: https://api.soulbits.app
      parameters:
        - $ref: "#/components/parameters/ModelType"
        - $ref: "#/components/parameters/InputModalities"
        - $ref: "#/components/parameters/OutputModalities"
      responses:
        "200":
          description: All active models (filtered).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ModelEntry" }

  # ---- Inference API: Chat ---------------------------------------------
  /v1/chat/completions:
    post:
      tags: [Chat]
      summary: Chat completions (LLM)
      description: |
        OpenAI-compatible chat completions. The gateway forwards the body as
        opaque JSON to the LLM worker (Aphrodite/vLLM/sglang), rewriting only
        the `model` field. **Non-streaming** — `stream:true` is ignored (the
        gateway uses a queue-based RPC pattern; every request returns one
        complete response object). Max body 1 MB; timeout 120s.
      servers:
        - url: https://beta.api.soulbits.app
        - url: https://api.soulbits.app
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatCompletionRequest" }
      responses:
        "200":
          description: Chat completion.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/RateLimitLimit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/RateLimitRemaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/RateLimitReset" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatCompletionResponse" }
        "400": { $ref: "#/components/responses/StandardError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "504":
          description: Gateway timeout — inference request timed out (includes `task_id`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # ---- Inference API: Embeddings ---------------------------------------
  /v1/embeddings:
    post:
      tags: [Embeddings]
      summary: Text embeddings
      description: OpenAI-compatible text embeddings (served by the Infinity engine). Supports Matryoshka `dimensions` and multimodal `modality`. Max body 1 MB; timeout 10s.
      servers:
        - url: https://beta.api.soulbits.app
        - url: https://api.soulbits.app
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmbeddingRequest" }
      responses:
        "200":
          description: Embeddings.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/RateLimitLimit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/RateLimitRemaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/RateLimitReset" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmbeddingResponse" }
        "400": { $ref: "#/components/responses/StandardError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  # ---- Inference API: Rerank ------------------------------------------
  /v1/rerank:
    post:
      tags: [Rerank]
      summary: Rerank documents by relevance to a query
      description: Cohere-compatible (served by the Infinity engine). Max body 1 MB; timeout 10s.
      servers:
        - url: https://beta.api.soulbits.app
        - url: https://api.soulbits.app
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RerankRequest" }
      responses:
        "200":
          description: Rerank results.
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/RateLimitLimit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/RateLimitRemaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/RateLimitReset" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RerankResponse" }
        "400": { $ref: "#/components/responses/StandardError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }

  # ---- Inference API: Audio (HSE) --------------------------------------
  /v1/audio/speech:
    post:
      tags: [Audio]
      summary: Text-to-Speech (TTS)
      description: |
        Harmony Speech Engine TTS. NOT OpenAI-shaped — requires `mode`; audio
        format via `output_options.format` (not `response_format`); cloning via
        `input_audio`/`input_embedding`. Max body 10 MB; timeout 120s.
      servers:
        - url: https://beta.api.soulbits.app
        - url: https://api.soulbits.app
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TTSRequest" }
      responses:
        "200":
          description: Synthesized audio (base64).
          headers:
            X-RateLimit-Limit: { $ref: "#/components/headers/RateLimitLimit" }
            X-RateLimit-Remaining: { $ref: "#/components/headers/RateLimitRemaining" }
            X-RateLimit-Reset: { $ref: "#/components/headers/RateLimitReset" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AudioDataResponse" }
        "400": { $ref: "#/components/responses/StandardError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
